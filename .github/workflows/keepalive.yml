name: keep-alive
# The free Supabase plan pauses a project after about a week without traffic. A light read every few days prevents that.
on:
  schedule:
    - cron: "17 5 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS "https://wjjexoyectojxdxigprz.supabase.co/rest/v1/ledger?id=eq.ledger&select=id" \
            -H "apikey: sb_publishable__5mdSDs65F8zkTt6r3NrfA_nFfXUA0C"

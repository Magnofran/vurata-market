<style>
/* Layout: a market ledger. Sticky bar (brand, tabs, sync), picker on the left, live order summary on the right at desktop.
   Three suppliers, three colors, used for bands, chips and receipt bars so a line is never mistaken for another supplier's. */
:root {
  --bg: #F3F5F3; --surface: #FFFFFF; --surface-2: #EBEEEB; --ink: #16201A; --muted: #56615A; --line: #D8DED9;
  --fv: #1B7F4B; --fv-t: #E3F2E9; --mt: #B3261E; --mt-t: #FBE7E5; --gr: #1F5FA8; --gr-t: #E5EDF8;
  --on-sup: #FFFFFF; --warn: #7A4E00; --warn-t: #FFF1CF; --warn-line: #E8CD8A; --danger: #B3261E; --ok: #1B7F4B;
  --shadow: 0 1px 2px rgba(20,30,25,.06), 0 4px 14px rgba(20,30,25,.06);
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1411; --surface: #161D19; --surface-2: #202923; --ink: #E8EDE9; --muted: #9AA69F; --line: #2D3832;
    --fv: #3FBF7C; --fv-t: #12271C; --mt: #F2736B; --mt-t: #2E1714; --gr: #6BA7F3; --gr-t: #132339;
    --on-sup: #0E1411; --warn: #F0C15A; --warn-t: #2B2410; --warn-line: #5C4A17; --danger: #F2736B; --ok: #3FBF7C;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1411; --surface: #161D19; --surface-2: #202923; --ink: #E8EDE9; --muted: #9AA69F; --line: #2D3832;
  --fv: #3FBF7C; --fv-t: #12271C; --mt: #F2736B; --mt-t: #2E1714; --gr: #6BA7F3; --gr-t: #132339;
  --on-sup: #0E1411; --warn: #F0C15A; --warn-t: #2B2410; --warn-line: #5C4A17; --danger: #F2736B; --ok: #3FBF7C;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; padding-inline: 0; padding-block: 0 24px; }
html, body { overflow-x: clip; max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; touch-action: manipulation; }
.cols > div, .cols > aside, .filters > * { min-width: 0; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2, h3, h4, p { margin: 0; }
.wrap { max-width: 1180px; margin-inline: auto; padding-inline: 16px; }

/* top bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 16px 0; }
.bar-in { max-width: 1180px; margin-inline: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brandwrap { min-width: 0; display: grid; gap: 3px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: -.01em; line-height: 1; }
.brand small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); letter-spacing: 0; margin-top: 3px; }
.sync { margin-left: 0; font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.sync[data-s="saved"] i { background: var(--ok); }
.sync[data-s="saving"] i { background: var(--warn); }
.sync[data-s="error"] i, .sync[data-s="readonly"] i { background: var(--danger); }
.sync span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 62vw; }
.tabs { max-width: 1180px; margin: 6px auto 0; display: grid; grid-template-columns: repeat(3, 1fr); }
.tab { appearance: none; background: none; border: 0; border-bottom: 3px solid transparent; padding: 9px 6px 10px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ink); }
.badge { font-family: var(--f-mono); font-size: 12px; background: var(--ink); color: var(--bg); border-radius: 99px; padding: 0 7px; min-width: 20px; text-align: center; }
.badge[data-n="0"] { display: none; }

/* layout */
.cols { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; margin-top: 16px; align-items: start; }
@media (min-width: 1000px) { .cols.two { grid-template-columns: minmax(0, 1fr) 340px; } .side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 100px); } }
.side { display: none; }
@media (min-width: 1000px) { .side { display: block; } .bottombar { display: none !important; } }

/* filters */
.filters { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
.sticky { margin-inline: -16px; padding-inline: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--barh, 92px)); z-index: 15; background: var(--bg); padding: 8px 0 6px; display: grid; gap: 10px; margin-top: -6px; }
.search { position: relative; }
.search input { width: 100%; height: 46px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 14px; font-size: 16px; }
.chips { display: flex; gap: 8px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -16px; padding-inline: 16px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; white-space: nowrap; }
.chip { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 12px; font-weight: 600; font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
.chip .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.chip[data-s="fv"] .dot { background: var(--fv); } .chip[data-s="mt"] .dot { background: var(--mt); } .chip[data-s="gr"] .dot { background: var(--gr); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chip small { font-family: var(--f-mono); font-size: 11px; opacity: .75; font-weight: 400; }
.row2 { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row2 select { flex: 1 1 220px; min-width: 0; height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 0 10px; }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 14px; color: var(--muted); }
.check input { width: 18px; height: 18px; accent-color: var(--ink); }

/* supplier bands and categories */
.supband { margin-top: 18px; padding: 10px 14px 11px; border-radius: 10px 10px 0 0; color: var(--on-sup); display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 12px; align-items: baseline; }
.supband .nm { font-family: var(--f-display); font-size: 18px; font-weight: 700; line-height: 1.2; }
.supband .ct { font-size: 12.5px; font-weight: 600; opacity: .95; white-space: nowrap; }
.supband small { grid-column: 1 / -1; font-size: 12.5px; line-height: 1.3; opacity: .92; }
.sup-fv { background: var(--fv); } .sup-mt { background: var(--mt); } .sup-gr { background: var(--gr); }
.cats { border: 1px solid var(--line); border-top: 0; border-radius: 0 0 10px 10px; background: var(--surface); overflow: hidden; }
.cat + .cat { border-top: 1px solid var(--line); }
.cat-h { width: 100%; appearance: none; background: none; border: 0; text-align: left; padding: 13px 14px; display: flex; gap: 10px; align-items: center; font-weight: 600; }
.cat-h .name { flex: 1; min-width: 0; }
.cat-h .count { font-size: 12px; color: var(--muted); font-weight: 400; font-family: var(--f-mono); }
.cat-h .picked { font-size: 12px; font-weight: 600; border-radius: 99px; padding: 1px 8px; background: var(--surface-2); }
.cat-h .picked:empty { display: none; }
.cat-h .chev { transition: transform .15s; color: var(--muted); }
.cat-h[aria-expanded="true"] .chev { transform: rotate(90deg); }
.cat-b { border-top: 1px solid var(--line); }
@media (prefers-reduced-motion: reduce) { .cat-h .chev { transition: none; } }

/* items */
.item { padding: 12px 14px; display: grid; gap: 8px; border-top: 1px solid var(--line); }
.item:first-child { border-top: 0; }
.item h4 { font-size: 15px; font-weight: 600; overflow-wrap: anywhere; }
.item .meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.item .meta b { color: var(--warn); font-weight: 600; }
.tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 99px; margin-right: 6px; color: var(--on-sup); vertical-align: 1px; }
.tag.fv { background: var(--fv); } .tag.mt { background: var(--mt); } .tag.gr { background: var(--gr); }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.opt.multi { padding: 6px 0; border-top: 1px dashed var(--line); }
.item.single { grid-template-columns: 46px minmax(0, 1fr) auto; align-items: center; gap: 12px; }
.item .head { display: flex; gap: 12px; align-items: center; }
.item .head > div { min-width: 0; }
.thumb { width: 46px; height: 46px; border-radius: 11px; display: grid; place-items: center; font-size: 25px; line-height: 1; background: var(--surface-2); flex: none; }
.thumb.s-fv { background: var(--fv-t); } .thumb.s-mt { background: var(--mt-t); } .thumb.s-gr { background: var(--gr-t); }
.thumb.sm { width: 36px; height: 36px; font-size: 20px; border-radius: 9px; }
.en { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.themebtn { appearance: none; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 5px 12px; font-size: 12.5px; font-weight: 600; display: inline-flex; gap: 6px; align-items: center; }
.item.on.s-fv { background: var(--fv-t); } .item.on.s-mt { background: var(--mt-t); } .item.on.s-gr { background: var(--gr-t); }
.price.line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; margin-top: 2px; }
.price { display: grid; line-height: 1.2; min-width: 0; }
.price b { font-family: var(--f-mono); font-weight: 500; font-size: 14px; }
.price span { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.price .ask { color: var(--warn); font-weight: 600; font-family: var(--f-body); }
.stepper { display: inline-flex; align-items: center; gap: 4px; flex: none; }
.stepper button { width: 38px; height: 38px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 20px; line-height: 1; font-weight: 500; display: grid; place-items: center; padding: 0; }
.stepper button:active { background: var(--surface-2); }
.stepper input { width: 58px; height: 38px; text-align: center; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; font-family: var(--f-mono); font-size: 15px; padding: 0 2px; }
.stepper .u { font-size: 12px; color: var(--muted); min-width: 30px; }
.opt.on .stepper input { font-weight: 600; border-color: var(--ink); }
.more { margin: 14px auto 0; display: block; }

/* buttons */
.btn { appearance: none; border: 1px solid var(--ink); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 16px; font-weight: 600; display: inline-flex; gap: 8px; align-items: center; justify-content: center; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.sm { padding: 6px 12px; font-size: 13px; border-radius: 8px; }
.btn.danger { background: transparent; color: var(--danger); border-color: var(--danger); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

/* summary card + bottom bar */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; box-shadow: var(--shadow); }
.card h3 { font-family: var(--f-display); font-size: 18px; margin-bottom: 10px; }
.sumrow { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; padding: 6px 0; font-size: 14px; }
.sumrow .sw { display: inline-flex; gap: 8px; align-items: center; min-width: 0; }
.sumrow .sw i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.grand { border-top: 2px solid var(--ink); margin-top: 8px; padding-top: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.grand b { font-family: var(--f-display); font-size: 26px; letter-spacing: -.01em; }
.hint { font-size: 12.5px; color: var(--muted); }
.bottombar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 12px; align-items: center; justify-content: space-between; box-shadow: 0 -4px 16px rgba(0,0,0,.08); }
.bottombar .t { display: grid; line-height: 1.15; }
.bottombar .t b { font-family: var(--f-display); font-size: 19px; }
.bottombar .t span { font-size: 12px; color: var(--muted); }
body.has-bar { padding-bottom: 92px; }

/* order view */
.grid2 { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.field input, .field select, .field textarea { width: 100%; min-height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; }
.field textarea { min-height: 64px; resize: vertical; }
.span-all { grid-column: 1 / -1; }
.warnbox { background: var(--warn-t); border: 1px solid var(--warn-line); color: var(--ink); border-radius: 12px; padding: 14px 16px; }
.warnbox h3 { color: var(--warn); font-family: var(--f-display); font-size: 16px; margin-bottom: 6px; }
.warnbox ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 14px; }
.stack { display: grid; gap: 16px; }
.sup-card { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.sup-head { padding: 12px 14px; color: var(--on-sup); display: grid; gap: 8px; }
.sup-head .top { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.sup-head h3 { font-family: var(--f-display); font-size: 19px; }
.sup-head .contact { font-size: 13px; opacity: .95; overflow-wrap: anywhere; }
.sup-head select { height: 34px; border-radius: 8px; border: 0; padding: 0 8px; background: var(--surface); color: var(--ink); font-weight: 600; }
.ln { display: grid; gap: 8px; padding: 12px 14px; border-top: 1px solid var(--line); }
.ln-name { min-width: 0; flex: 1 1 220px; }
.ln-name b { font-weight: 600; overflow-wrap: anywhere; }
.ln-name p { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.ln-name p.chk { color: var(--warn); }
.ln-total { text-align: right; min-width: 104px; }
.ln-total b { display: block; font-family: var(--f-mono); font-weight: 500; }
.ln-total span { font-size: 12px; color: var(--muted); }
.linkbtn { appearance: none; background: none; border: 0; padding: 2px 0; color: var(--muted); text-decoration: underline; font-size: 13px; justify-self: start; }
.ln input.note { width: 100%; height: 34px; border: 1px dashed var(--line); background: transparent; border-radius: 8px; padding: 0 10px; font-size: 13.5px; }
.x { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 18px; display: grid; place-items: center; padding: 0; }
.sub { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 12px 14px; background: var(--surface-2); font-size: 14px; }
.sub b { font-family: var(--f-mono); font-weight: 500; }
.supnote { padding: 10px 14px 14px; }
.supnote input { width: 100%; height: 38px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 0 10px; }
.empty { text-align: center; padding: 44px 16px; color: var(--muted); display: grid; gap: 12px; justify-items: center; }
.empty h3 { font-family: var(--f-display); font-size: 22px; color: var(--ink); }
.pill { font-size: 12px; font-weight: 600; border-radius: 99px; padding: 2px 10px; background: var(--surface-2); }

/* share view */
.pre { width: 100%; min-height: 320px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px; font-family: var(--f-mono); font-size: 12.5px; line-height: 1.5; resize: vertical; white-space: pre; overflow: auto; }
.pre { white-space: pre-wrap; overflow-wrap: anywhere; word-break: break-word; overflow-x: hidden; overflow-y: auto; font-size: 12px; line-height: 1.55; overscroll-behavior: contain; }
.pre.sm { min-height: 190px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.msg-head { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.msg-head h3 { margin: 0; display: flex; align-items: center; gap: 8px; }
.msg-head h3 i { width: 12px; height: 12px; border-radius: 3px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
a.btn { text-decoration: none; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: 90vw; box-shadow: var(--shadow); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
@media (max-width: 520px) {
  input, select, textarea { font-size: 16px !important; }
  .legend { display: none; }
  .brand small { display: none; }
  .row2 select { flex: 1 1 140px; }
  .ln-right { width: 100%; justify-content: space-between; }
  .ln-name { flex-basis: 100%; }
  .item.single { grid-template-columns: 40px minmax(0, 1fr) auto; gap: 10px; }
  .thumb { width: 40px; height: 40px; font-size: 22px; }
  .stepper { gap: 3px; } .stepper button { width: 34px; height: 36px; } .stepper input { width: 46px; height: 36px; }
  .stepper .u { display: none; }
  .tab { padding: 8px 9px 9px; } .sync span { max-width: 38vw; }
  .item { padding: 11px 12px; } .cat-h { padding: 12px; }
}

/* ---- refinement: flat, hairline, one rhythm (4/8/16/24) ---- */
:root { --shadow: none; --r: 12px; }
body { font-size: 15px; letter-spacing: -.003em; }
.brand { font-size: 21px; }
.sync { font-size: 12px; } .sync i { width: 6px; height: 6px; }
.themebtn { background: transparent; color: var(--muted); border-color: var(--line); padding: 6px 12px; }
.tab { font-size: 14.5px; }
.card, .sup-card, .cats { box-shadow: none; border-radius: var(--r); }
.card { padding: 20px 16px; } .card h3 { font-size: 17px; margin-bottom: 12px; }
.cols { gap: 24px; margin-top: 8px; }
.search input { height: 46px; border-radius: var(--r); border-color: var(--line); background: var(--surface); }
.chip { padding: 7px 14px; font-weight: 500; font-size: 13.5px; }
.chip[aria-pressed="true"] { font-weight: 600; }
.chip small { opacity: .6; }
.row2 select { height: 44px; border-radius: var(--r); flex: 1 1 100%; }
.supband { background: transparent !important; color: var(--ink); margin-top: 28px; padding: 0 2px 10px; border-radius: 0; grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: center; border-bottom: 1px solid var(--line); }
.supband .dotc, .sup-head .dotc { width: 10px; height: 10px; border-radius: 3px; display: inline-block; background: var(--c); flex: none; }
.sup-fv { --c: var(--fv); } .sup-mt { --c: var(--mt); } .sup-gr { --c: var(--gr); }
.supband .nm { font-size: 18px; } .supband .ct { color: var(--muted); font-weight: 500; font-family: var(--f-mono); font-size: 12px; }

/* ---- overview, payments, sales, QR, upload ---- */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.stats > div { display: grid; gap: 2px; padding: 12px; background: var(--surface-2); border-radius: 10px; min-width: 0; }
.stats b { font-size: 16px; font-family: var(--f-display); overflow-wrap: anywhere; } .stats span { font-size: 11.5px; color: var(--muted); }
.payrow { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 10px 12px; background: var(--surface-2); border-radius: 10px; }
.pill.pay { background: var(--surface); border: 1px solid var(--line-dark); }
.payrow .dep .lpr input { width: 100px; height: 34px; }
.due { margin-left: auto; font-size: 13px; font-weight: 600; }
.lseg.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.qrbox { margin-top: 16px; text-align: center; }
.qrbox svg { width: 100%; max-width: 320px; height: auto; display: block; margin: 8px auto; border: 1px solid var(--line-dark); border-radius: 10px; }
.filebtn { width: 100%; min-height: 48px; cursor: pointer; position: relative; }
.filebtn.off { opacity: .45; cursor: not-allowed; }
.filebtn:focus-within { outline: 2px solid var(--ink); outline-offset: 2px; }

/* ---- customer Send: one clear choice ---- */
.choose { font-size: 14px; margin: 4px 0 12px; }
.sendseg button { display: flex; align-items: center; justify-content: center; gap: 7px; padding: 12px 4px; }
.sendseg .no { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid currentColor; font-size: 11px; font-weight: 700; flex: none; }
.sendpanel { margin-top: 16px; display: grid; gap: 12px; }
.opt-h { font-family: var(--f-display); font-size: 16px; margin: 0; }
.sendpanel .hint { margin: 0; }
.steps { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 14px; }
.sendpanel .qrbox { margin-top: 0; }
.sendpanel .pre.sm { min-height: 150px; max-height: 260px; }

/* ---- required fields, gate, smaller message text ---- */
.req { color: var(--danger); font-style: normal; font-weight: 700; margin-left: 2px; }
.reqnote { font-family: var(--f-body); font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 8px; }
.field.miss input, .field.miss select { border-color: var(--danger); }
.gate { padding: 12px 14px; border: 1px solid var(--danger); border-radius: 10px; background: color-mix(in srgb, var(--danger) 9%, var(--surface)); margin: 12px 0 14px; font-size: 14px; line-height: 1.45; }
@media (max-width: 520px) { textarea.pre { font-size: 12.5px !important; } }

/* ---- subtle, branded hover and press states (devices with a pointer only) ---- */
.btn, .chip, .tab, .lseg button, .stepper button, .linkbtn, .themebtn, .x, .fav, .stbtn, .pbtn, .cat-h, .toast-act { transition: background-color .16s ease, border-color .16s ease, color .16s ease, box-shadow .16s ease, transform .16s ease, opacity .16s ease; }
@media (hover: hover) {
  .btn:not(.ghost):not(.danger):not([disabled]):hover { background: color-mix(in srgb, var(--ink) 84%, var(--bg)); box-shadow: 0 3px 12px color-mix(in srgb, var(--ink) 20%, transparent); transform: translateY(-1px); }
  .btn.ghost:not([disabled]):hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--ink) 38%, var(--surface)); transform: translateY(-1px); box-shadow: 0 2px 8px color-mix(in srgb, var(--ink) 10%, transparent); }
  .btn.danger:not([disabled]):hover { background: color-mix(in srgb, var(--danger) 12%, var(--surface)); }
  .btn:not([disabled]):active { transform: translateY(0); box-shadow: none; }
  .chip:not([aria-pressed="true"]):hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--ink) 34%, var(--surface)); }
  .chip[data-s="fv"]:not([aria-pressed="true"]):hover { background: color-mix(in srgb, var(--fv) 20%, var(--surface)); }
  .chip[data-s="mt"]:not([aria-pressed="true"]):hover { background: color-mix(in srgb, var(--mt) 18%, var(--surface)); }
  .chip[data-s="gr"]:not([aria-pressed="true"]):hover { background: color-mix(in srgb, var(--gr) 18%, var(--surface)); }
  .chip[aria-pressed="true"]:hover { filter: brightness(1.12); }
  .tab:not([aria-selected="true"]):hover { color: var(--ink); border-bottom-color: color-mix(in srgb, var(--ink) 30%, transparent); }
  .lseg button:not([aria-pressed="true"]):hover { background: var(--surface-2); }
  .lseg button[aria-pressed="true"]:hover { filter: brightness(1.15); }
  .stepper button:not([disabled]):hover { background: var(--surface-2); border-color: color-mix(in srgb, var(--ink) 55%, var(--surface)); }
  .opt.on .stepper button[data-act="inc"]:hover { background: color-mix(in srgb, var(--ink) 82%, var(--bg)); }
  .linkbtn:hover, .pbtn:hover { color: var(--ink); }
  .linkbtn:hover { text-decoration-thickness: 2px; }
  .themebtn:hover { background: var(--surface-2); color: var(--ink); border-color: color-mix(in srgb, var(--ink) 34%, var(--surface)); }
  .x:hover { background: color-mix(in srgb, var(--danger) 10%, var(--surface)); color: var(--danger); }
  .fav:hover { opacity: 1; border-color: #E5C468; color: #C58A00; }
  .stbtn:not(.st-o):not(.st-x):hover { border-color: var(--ink); color: var(--ink); }
  .stbtn.st-o:hover, .stbtn.st-x:hover { filter: brightness(1.1); }
  .cat-h:hover { background: var(--surface-2); }
  .toast-act:hover { opacity: .8; }
  .filebtn:hover { background: color-mix(in srgb, var(--ink) 84%, var(--bg)); }
}
@media (prefers-reduced-motion: reduce) { .btn, .chip, .tab, .lseg button, .stepper button, .linkbtn, .themebtn, .x, .fav, .stbtn, .pbtn, .cat-h, .toast-act { transition: none; } .btn:hover { transform: none !important; } }

/* ---- main tabs: share the row evenly on every width, swipe only when they cannot fit ---- */
.tabs.c5 { display: flex; justify-content: flex-start; gap: 0; }
.tabs.c5 .tab { flex: 1 0 auto; min-width: max-content; padding-inline: clamp(6px, 1.6vw, 18px); }
@media (max-width: 560px) { .tabs.c5 .tab { font-size: 14px; padding-inline: 4px; } }
@media (max-width: 360px) { .tabs.c5 .tab { font-size: 13px; padding-inline: 3px; gap: 4px; } }

/* ---- variants read as children of their product: indented under the name, on a coloured rail ---- */
.item.s-fv { --sc: var(--fv); } .item.s-mt { --sc: var(--mt); } .item.s-gr { --sc: var(--gr); }
.item:not(.single) { gap: 6px; }
.item:not(.single) > .head { margin-bottom: 4px; }
.opt.multi { border-top: 0; margin-left: 58px; padding: 9px 12px 9px 14px; border-left: 3px solid color-mix(in srgb, var(--sc, var(--ink)) 45%, transparent); border-radius: 2px 10px 10px 2px; background: color-mix(in srgb, var(--ink) 5%, transparent); transition: background-color .16s ease, border-color .16s ease; }
.opt.multi.on { border-left-color: var(--sc, var(--ink)); background: color-mix(in srgb, var(--sc, var(--ink)) 13%, transparent); }
.opt.multi .price > span:not(.lt) { order: 1; font-size: 13.5px; font-weight: 600; color: var(--ink); }
.opt.multi .price > b { order: 2; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.opt.multi .price > .lt { order: 3; margin-top: 2px; }
@media (hover: hover) { .opt.multi:not(.on):hover { background: color-mix(in srgb, var(--ink) 9%, transparent); } }
@media (max-width: 520px) { .opt.multi { margin-left: 52px; padding: 8px 10px 8px 12px; gap: 8px; } }
@media (max-width: 380px) { .opt.multi { margin-left: 40px; } }

/* ---- stepper: unit sits beside the number, clearer outlines ---- */
.stepper .minus { order: 0; } .stepper input { order: 1; } .stepper .u { order: 2; } .stepper button[data-act="inc"] { order: 3; }
.stepper { gap: 0; } .stepper .minus { margin-right: 2px; } .stepper button[data-act="inc"] { margin-left: 8px; }
.stepper input { width: 34px; text-align: right; }
.stepper .u { min-width: 0; margin-left: 4px; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.stepper button { border-color: color-mix(in srgb, var(--ink) 42%, var(--surface)); }
.stepper .minus { background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); }
.stepper .minus, .stepper button[data-act="inc"] { font-weight: 600; }
@media (max-width: 520px) { .opt.on .stepper .u { display: inline; } .stepper input { width: 30px; } }
@media (max-width: 520px) { .ln .stepper .u { display: inline; } }

/* ---- fluid 3-way choosers: font and spacing shrink with the width, labels never wrap or clip ---- */
.sendseg button { min-width: 0; white-space: nowrap; font-size: clamp(11px, 3.7vw, 14.5px); gap: clamp(3px, 1.4vw, 7px); padding: 12px 2px; }
.sendseg .no { width: clamp(15px, 4.8vw, 20px); height: clamp(15px, 4.8vw, 20px); font-size: clamp(9px, 2.8vw, 11px); }
/* ---- next-step banner and fresh-import highlight ---- */
.nextstep { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; margin-bottom: 14px; border-radius: var(--r); background: var(--surface-2); box-shadow: inset 4px 0 0 var(--ink); font-size: 14px; line-height: 1.35; }
.nextstep span { min-width: 0; } .nextstep i { display: block; font-style: normal; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin-bottom: 2px; }
.nextstep .btn { flex: none; width: auto; }
@media (max-width: 520px) { .nextstep { flex-direction: column; align-items: stretch; } .nextstep .btn { width: 100%; } }
.ccard.flash { animation: flashin 2.4s ease-out; }
@keyframes flashin { 0% { box-shadow: 0 0 0 3px var(--ink); } 100% { box-shadow: 0 0 0 3px transparent; } }
@media (prefers-reduced-motion: reduce) { .ccard.flash { animation: none; box-shadow: 0 0 0 3px var(--ink); } }
.sendpanel { grid-template-columns: minmax(0, 1fr); } .sendpanel > * { min-width: 0; } .sendpanel textarea { width: 100%; max-width: 100%; box-sizing: border-box; }
.sendpanel .actions.duo { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.actions.duo { grid-template-columns: repeat(2, minmax(0, 1fr)); } .actions .btn { min-width: 0; white-space: normal; line-height: 1.2; }

/* ---- delivery, free-delivery nudge, order again, new supplier ---- */
.fdel { margin: 10px 0 2px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); font-size: 13px; display: grid; gap: 7px; }
.fdel i { display: block; height: 6px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 14%, transparent); overflow: hidden; } .fdel u { display: block; height: 100%; background: var(--ink); border-radius: 99px; text-decoration: none; transition: width .3s ease; }
.fdel.ok { color: var(--ink); font-weight: 600; background: color-mix(in srgb, var(--fv) 14%, var(--surface)); }
.dlnote { margin-top: 6px; } .dlnote.ok { color: var(--ink); font-weight: 600; }
.again { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; margin: 14px 0 4px; border-radius: var(--r); background: var(--surface-2); box-shadow: inset 4px 0 0 var(--ink); }
.again b { display: block; font-size: 15px; } .again span { font-size: 12.5px; color: var(--muted); } .again .btn { flex: none; width: auto; }
.dzhead { display: grid; grid-template-columns: minmax(0, 1fr) 128px 34px; gap: 8px; margin: 14px 0 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.dzrow { display: grid; grid-template-columns: minmax(0, 1fr) 128px 34px; gap: 8px; align-items: center; margin-bottom: 8px; }
.dzrow > input { min-width: 0; } .dzrow .lpr input { width: 100%; min-width: 0; }
.newsup { display: grid; gap: 10px; padding: 12px; border-radius: 10px; background: var(--surface-2); } .newsup[hidden] { display: none; }
.dzrow > input, .dzrow .lpr input { width: 100%; min-height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; } .dzrow .lpr { display: flex; align-items: center; gap: 6px; } .dzrow .lpr input { text-align: right; }
.actions.duo:has(> :only-child) { grid-template-columns: minmax(0, 1fr); }

/* ---- goal strip on the bottom bar, minimum-order warning ---- */
.bottombar { overflow: visible; } .bbprog { position: absolute; left: 0; right: 0; top: -3px; height: 3px; background: color-mix(in srgb, var(--ink) 12%, transparent); } .bbprog[hidden] { display: none; }
.bbprog u { display: block; height: 100%; width: 0; background: var(--ink); transition: width .3s ease; text-decoration: none; } .bbprog.min u { background: var(--warn); } .bbprog.ok u { background: var(--fv); }
.fdel.warn { background: color-mix(in srgb, var(--warn) 14%, var(--surface)); } .fdel.warn i u { background: var(--warn); }
.bottombar .t span { transition: color .2s ease; }

/* ---- order details: every box the same height, padding, radius and arrow; payment and date get a full row on phones ---- */
#orderBody .field input, #orderBody .field select { height: 48px; min-height: 48px; padding: 0 14px; border-radius: 12px; font-size: 16px; line-height: 1.2; box-sizing: border-box; }
#orderBody .field textarea { min-height: 88px; padding: 12px 14px; border-radius: 12px; font-size: 16px; box-sizing: border-box; }
#orderBody .field select { -webkit-appearance: none; appearance: none; padding-right: 40px; text-overflow: ellipsis; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 21px) 50%, calc(100% - 15px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
#orderBody .field input[type="date"] { -webkit-appearance: none; appearance: none; display: block; text-align: left; }
#orderBody .field input[type="date"]::-webkit-date-and-time-value { text-align: left; }
@media (max-width: 560px) { #orderBody .grid2 > .field:has(#m-pay), #orderBody .grid2 > .field:has(#m-need) { grid-column: 1 / -1; } }

/* ---- sold out, packing, days off, repeat customers ---- */
.sopill { display: inline-block; padding: 7px 12px; border-radius: 99px; font-size: 12.5px; font-weight: 600; background: color-mix(in srgb, var(--ink) 10%, transparent); color: var(--muted); }
.item.so { opacity: .62; }
.dayrow { display: grid; grid-template-columns: 150px minmax(0, 1fr) 34px; gap: 8px; align-items: center; margin-bottom: 8px; }
.dayrow input { width: 100%; min-width: 0; min-height: 40px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 10px; }
.stop { border: 1px solid var(--line-dark); border-radius: 12px; margin-bottom: 10px; overflow: hidden; background: var(--surface); }
.stop.ready { border-color: var(--fv); }
.stophead { appearance: none; width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: none; border: 0; text-align: left; color: var(--ink); }
.stophead .sh1 { display: grid; gap: 2px; min-width: 0; } .stophead .sh1 span { font-size: 12px; color: var(--muted); }
.stophead .sh2 { display: grid; gap: 4px; justify-items: end; flex: none; font-size: 13px; }
.packpill { font-style: normal; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 10%, transparent); } .packpill.ok { background: var(--fv); color: var(--on-sup, #fff); }
.stopbody { border-top: 1px dashed var(--line-dark); padding: 10px 14px 14px; display: grid; gap: 10px; }
.prow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; } .prow small { color: var(--muted); display: block; font-size: 12px; }
.prow .lpr input { width: 70px; min-height: 36px; text-align: right; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 0 8px; }
@media (hover: hover) { .stophead:hover { background: var(--surface-2); } }
.saved-chip small { opacity: .8; }

/* ---- customer order cards: numbered, status-coloured, receipt-style header ---- */
.hist .ccard, #custList .ccard { border: 1px solid var(--line-dark); border-left: 5px solid var(--sa, var(--line-dark)); border-radius: 12px; padding: 14px 14px 12px; margin-bottom: 14px; background: var(--surface); gap: 12px; }
.ccard:first-child { padding-top: 14px; } .ccard { border-top-width: 1px; }
.ccard[data-st="new"] { --sa: var(--warn); } .ccard[data-st="ordered"] { --sa: var(--gr); } .ccard[data-st="delivered"] { --sa: var(--fv); }
.chead { display: flex; align-items: center; gap: 8px; min-width: 0; }
.ono { flex: none; display: inline-grid; place-items: center; min-width: 38px; height: 28px; padding: 0 9px; border-radius: 8px; background: var(--ink); color: var(--bg); font-family: var(--f-mono); font-weight: 700; font-size: 14px; }
.ono.sm { min-width: 0; height: 22px; padding: 0 7px; font-size: 12px; vertical-align: 1px; margin-right: 4px; border-radius: 6px; }
.cname { font-size: 16px; overflow-wrap: break-word; word-break: normal; min-width: 0; flex: 0 1 auto; }
.leader { flex: 1 1 14px; min-width: 14px; height: 0; border-top: 1px solid var(--line-dark); align-self: center; }
.ctot { flex: none; font-weight: 700; font-size: 16px; white-space: nowrap; }
.cinfo { display: grid; gap: 7px; margin: 0; padding: 10px 0 2px; border-top: 1px solid var(--line); }
.cinfo > div { display: grid; grid-template-columns: 68px minmax(0, 1fr); gap: 10px; align-items: baseline; }
.cinfo dt { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.cinfo dd { margin: 0; font-size: 14px; overflow-wrap: anywhere; } .cinfo dd a { color: var(--ink); text-underline-offset: 3px; }
.repcard { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); box-shadow: inset 3px 0 0 var(--ink); font-size: 13.5px; }
.repcard .rt { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.repcard .rr { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 8px; align-items: baseline; } .repcard .rr span { font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.repcard .rr.warn { color: var(--ink); } .repcard .rr.warn span { color: var(--warn); }
.ccard .linkbtn[data-act="cview"] { display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; text-decoration: none; font-weight: 600; justify-self: stretch; }
.ccard .linkbtn[data-act="cview"]::after { content: "\25BE"; opacity: .6; }
.ccard[data-st="delivered"] { opacity: .88; }
.ccard .cctrl select[data-cstatus] { border-left: 4px solid var(--sa, var(--line)); font-weight: 600; }
@media (max-width: 420px) { .cinfo > div { grid-template-columns: 60px minmax(0, 1fr); gap: 8px; } .repcard .rr { grid-template-columns: 1fr; gap: 2px; } }
@media (hover: hover) { .ccard .linkbtn[data-act="cview"]:hover { background: var(--surface-2); } }

/* ---- calmer, symmetrical controls on customer cards ---- */
.pill { border-radius: 8px; padding: 3px 9px; }
.ono, .ono.sm { min-width: 0; height: 22px; padding: 0 7px; border-radius: 6px; font-size: 12px; }
.chead { gap: 8px; } .cname { flex: 0 1 auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 15.5px; }
.leader { flex: 1 1 8px; min-width: 8px; } .ctot { font-size: 15px; }
.crow2 { display: grid; grid-template-columns: minmax(0, .85fr) minmax(0, 1.15fr); gap: 8px; }
.csel { width: 100%; min-width: 0; height: 40px; border: 1px solid var(--line-dark); background-color: var(--surface); border-radius: 10px; padding: 0 30px 0 12px; font-size: 14px; font-weight: 600; text-overflow: ellipsis; -webkit-appearance: none; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 17px) 50%, calc(100% - 12px) 50%; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.ccard .cctrl select[data-cstatus] { border-left: 1px solid var(--line-dark); }
.payrow { padding: 10px 12px; border-radius: 10px; }
.ccard .cctrl { gap: 10px 18px; }
/* ---- bill lines: name and total on top, quantity controls tucked underneath ---- */
.cdet { gap: 0; padding-top: 6px; }
.cline2 { display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; padding: 11px 0; border-top: 1px solid var(--line); }
.hsup + .cline2 { border-top: 0; }
.cl-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.cl-name { font-weight: 600; font-size: 14.5px; min-width: 0; overflow-wrap: break-word; } .cl-t { min-width: 0; flex: none; font-size: 13.5px; font-weight: 600; }
.cl-sub { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.cl-meta { font-size: 12.5px; color: var(--muted); min-width: 0; } .cl-meta em { display: block; font-style: normal; margin-top: 2px; }
.qmini { display: inline-flex; align-items: center; gap: 2px; flex: none; }
.qmini button { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--line-dark); background: transparent; color: var(--ink); font-size: 16px; line-height: 1; padding: 0; display: grid; place-items: center; }
.qmini .cq { min-width: 30px; text-align: center; font-family: var(--f-mono); font-weight: 600; font-size: 13.5px; }
@media (hover: hover) { .qmini button:hover { background: var(--surface-2); border-color: var(--ink); } }
/* ---- combined order: collapsible supplier lists, jump chips ---- */
.suptog { appearance: none; display: flex; justify-content: space-between; align-items: center; width: 100%; margin-top: 8px; padding: 9px 12px; border: 1px solid var(--line-dark); border-radius: 10px; background: color-mix(in srgb, var(--surface) 70%, transparent); color: var(--ink); font-weight: 600; font-size: 13.5px; }
.suptog i { font-style: normal; opacity: .6; }
.suplist { margin-top: 6px; }
@media (hover: hover) { .suptog:hover { background: var(--surface); border-color: var(--ink); } }
.cjump { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: none; -webkit-overflow-scrolling: touch; } .cjump::-webkit-scrollbar { display: none; } .cjump .chip { flex: none; }
.pbox .sumrow .num { white-space: nowrap; }
#combCard .check { margin-bottom: 4px; }

/* ---- front delivery info, free-delivery incentive, next-step button, focus rings ---- */

  --r: 3px; --f-display: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --f-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; --f-mono: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;

    --fv: #8DB07B; --fv-t: #1A2418; --mt: #D98B7D; --mt-t: #2B1B18; --gr: #8FB0D8; --gr-t: #16212F; --on-sup: #0F1115;

  }
}

  --bg: #0F1115; --surface: #1A1D23; --surface-2: #22262E; --ink: #F1F5F9; --muted: #94A3B8; --line: #2B2F38; --gold: #D8BD8F; --gold-h: #C2A679; --gold-text: #D8BD8F;
  --fv: #8DB07B; --fv-t: #1A2418; --mt: #D98B7D; --mt-t: #2B1B18; --gr: #8FB0D8; --gr-t: #16212F; --on-sup: #0F1115;
